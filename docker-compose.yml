version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: event-venue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventvenue
      POSTGRES_USER: eventuser
      POSTGRES_PASSWORD: eventpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
